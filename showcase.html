<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title id="tab-title">DMS Interactive Showcase</title>

    <!-- أيقونة التبويب العلوية (Favicon) -->
    <link rel="icon" type="image/png" href="dms-silver-logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #6a348c;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 16px;
            color: #ffffff;
            position: relative;
            overflow-x: hidden;
        }

        /* العلامة المائية لشعار DMS على جانبي الشاشة */
        .bg-watermark {
            position: fixed;
            width: 520px;
            height: 520px;
            pointer-events: none;
            opacity: 0.12;
            filter: grayscale(100%) brightness(200%);
            z-index: 0;
            user-select: none;
        }

        .bg-watermark.left {
            top: 15%;
            left: -160px;
            transform: rotate(-15deg);
        }

        .bg-watermark.right {
            bottom: 10%;
            right: -160px;
            transform: rotate(20deg);
        }

        .header-container {
            width: 100%;
            max-width: 960px;
            text-align: center;
            z-index: 2;
            margin-bottom: 20px;
        }

        .main-title {
            color: #ffffff;
            font-size: clamp(1.15rem, 4.2vw, 1.85rem);
            font-weight: 900;
            line-height: 1.45;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            padding: 0 8px;
        }

        .showcase-area {
            flex: 1;
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* فريم الفيديو التفاعلي */
        .custom-video-frame {
            width: 100%;
            background: #10081a;
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .frame-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 8px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .window-dots {
            display: flex;
            gap: 6px;
        }

        .window-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .frame-label {
            font-size: 0.78rem;
            color: #94a3b8;
            font-weight: 600;
        }

        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-box video, .video-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            object-fit: contain;
        }

        /* فريم المستندات والصور مع التكبير */
        .custom-image-frame {
            width: 100%;
            background: rgba(18, 10, 28, 0.9);
            backdrop-filter: blur(14px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .image-toolbar {
            height: 48px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toolbar-text {
            font-size: 0.82rem;
            color: #4ade80;
            font-weight: 700;
        }

        .toolbar-btns {
            display: flex;
            gap: 6px;
        }

        .zoom-btn {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 700;
        }

        .zoom-btn:hover {
            background: #4ade80;
            color: #0f172a;
        }

        .image-canvas {
            width: 100%;
            min-height: 450px;
            max-height: 75vh;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0510;
            padding: 16px;
        }

        .image-canvas img {
            max-width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.15s ease-out;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .footer-nav {
            margin-top: 22px;
            z-index: 2;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 24px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.22);
            transition: background 0.2s;
            cursor: pointer;
            display: inline-block;
        }

        .btn-back:hover {
            background: #ffffff;
            color: #6a348c;
        }

        @media screen and (max-width: 768px) {
            body { padding: 16px 10px 25px; }
            .bg-watermark { width: 300px; height: 300px; }
            .custom-video-frame { padding: 8px; border-radius: 14px; }
            .image-canvas { min-height: 360px; max-height: 60vh; padding: 6px; }
        }
    </style>
</head>

        function renderPage() {

            const id = urlParams.get('id') || "daily-1";
            const item = items[id] || items["daily-1"];

            document.getElementById('page-title').textContent = item.title;
            document.getElementById('tab-title').textContent = item.title;

            const container = document.getElementById('showcase-area');

            if (item.type === "video") {
                container.innerHTML = `
                    <div class="custom-video-frame">
                        <div class="frame-header">
                            <div class="window-dots">
                                <span class="dot-red"></span>
                                <span class="dot-yellow"></span>

                            </div>

                        </div>
                        <div class="video-box">

                                المتصفح لا يدعم هذا الفيديو.
                            </video>
                        </div>
                    </div>
                `;
            } else if (item.type === "drive_video") {
                container.innerHTML = `
                    <div class="custom-video-frame">
                        <div class="frame-header">
                            <div class="window-dots">
                                <span class="dot-red"></span>
                                <span class="dot-yellow"></span>
                                <span class="dot-green"></span>
                            </div>
                            <span class="frame-label">DMS Drive Streaming Player</span>
                        </div>
                        <div class="video-box">
                            <iframe src="${item.src}" allow="autoplay; fullscreen"></iframe>
                        </div>
                    </div>
                `;
            } else if (item.type === "image") {
                container.innerHTML = `
                    <div class="custom-image-frame">
                        <div class="image-toolbar">
                            <span class="toolbar-text">معاينة الشاشة التوضيحية</span>
                            <div class="toolbar-btns">

                                <button class="zoom-btn" id="zout">تصغير (-)</button>
                                <button class="zoom-btn" id="zreset">إعادة ضبط</button>
                            </div>
                        </div>
                        <div class="image-canvas" id="canvas">
                            <img id="zoom-img" src="${item.src}" alt="${item.title}">
                        </div>
                    </div>
                `;

                const img = document.getElementById('zoom-img');
                let scale = 1;
                document.getElementById('zin').onclick = () => { scale = Math.min(scale + 0.35, 3.5); img.style.transform = `scale(${scale})`; };
                document.getElementById('zout').onclick = () => { scale = Math.max(scale - 0.35, 0.7); img.style.transform = `scale(${scale})`; };
                document.getElementById('zreset').onclick = () => { scale = 1; img.style.transform = `scale(1)`; };
            }
        }
